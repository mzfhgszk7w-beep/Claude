<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Blackridge Systems — Equipment. Technology. Solutions.</title>
<style>
  :root{
    --bg:#0c0e11;
    --bg2:#12151a;
    --panel:#171b21;
    --panel2:#1d222a;
    --line:#2a313b;
    --red:#d21f2b;
    --red-dark:#8f141d;
    --text:#e8ebef;
    --muted:#9aa4b0;
    --steel:#c6ccd4;
    font-size:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}

  /* ---------- NAV ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    background:rgba(12,14,17,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:1200px;margin:0 auto;padding:0 20px;
    display:flex;align-items:center;justify-content:space-between;height:64px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:.95rem;white-space:nowrap;cursor:pointer;}
  .brand .b1{color:#fff;}
  .brand .b2{color:var(--red);}
  .brand .chev{color:var(--red);font-size:1.1rem;line-height:1;}
  nav.links{display:flex;gap:26px;align-items:center;}
  nav.links a{
    font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);
    padding:6px 2px;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;
  }
  nav.links a:hover{color:#fff;border-color:var(--red);}
  .nav-right{display:flex;align-items:center;gap:14px;}
  .lang{display:flex;gap:4px;border:1px solid var(--line);border-radius:6px;padding:3px;}
  .lang button{
    background:none;border:none;color:var(--muted);font-size:.72rem;font-weight:700;
    letter-spacing:.08em;padding:5px 9px;border-radius:4px;cursor:pointer;transition:all .2s;
  }
  .lang button:hover{color:#fff;}
  .lang button.active{background:var(--red);color:#fff;}
  .cta-mini{
    background:var(--red);color:#fff;font-size:.75rem;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;padding:10px 18px;border-radius:6px;transition:background .2s;white-space:nowrap;
  }
  .cta-mini:hover{background:var(--red-dark);}
  .burger{display:none;background:none;border:1px solid var(--line);border-radius:6px;color:#fff;font-size:1.2rem;padding:6px 12px;cursor:pointer;}
  .mobile-menu{display:none;flex-direction:column;background:var(--bg2);border-top:1px solid var(--line);padding:10px 20px 18px;}
  .mobile-menu a{padding:12px 4px;border-bottom:1px solid var(--line);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);}
  .mobile-menu a:last-child{border-bottom:none;}
  .mobile-menu.open{display:flex;}

  /* ---------- HERO ---------- */
  .hero{
    padding:130px 20px 70px;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(210,31,43,.10), transparent 70%),
      linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);
    border-bottom:1px solid var(--line);
  }
  .hero-inner{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;}
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    border:1px solid var(--red);color:#ff5b64;font-size:.7rem;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;padding:6px 14px;border-radius:999px;margin-bottom:22px;
  }
  .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);}
  h1{font-size:clamp(1.9rem,4.2vw,3rem);line-height:1.15;font-weight:800;letter-spacing:.02em;margin-bottom:18px;}
  h1 .accent{color:var(--red);}
  .hero p.lead{color:var(--muted);font-size:1.05rem;max-width:34em;margin-bottom:30px;}
  .btn-row{display:flex;gap:14px;flex-wrap:wrap;}
  .btn{
    display:inline-block;padding:14px 28px;border-radius:6px;font-weight:700;font-size:.85rem;
    letter-spacing:.1em;text-transform:uppercase;transition:all .2s;cursor:pointer;border:none;
  }
  .btn.primary{background:var(--red);color:#fff;}
  .btn.primary:hover{background:var(--red-dark);transform:translateY(-2px);}
  .btn.ghost{border:1px solid var(--line);color:var(--steel);background:transparent;}
  .btn.ghost:hover{border-color:var(--red);color:#fff;transform:translateY(-2px);}
  .hero-logo{
    border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(210,31,43,.08);
  }
  .tagline{
    text-align:center;color:var(--muted);letter-spacing:.35em;text-transform:uppercase;
    font-size:.72rem;margin-top:14px;
  }
  .tagline b{color:var(--red);}

  /* ---------- STATS ---------- */
  .stats{max-width:1100px;margin:0 auto;padding:46px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 20px;text-align:center;}
  .stat .num{font-size:1.7rem;font-weight:800;color:#fff;}
  .stat .num span{color:var(--red);}
  .stat .lbl{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px;}

  /* ---------- SECTIONS ---------- */
  section{padding:80px 20px;}
  section:nth-of-type(even){background:var(--bg2);}
  .wrap{max-width:1100px;margin:0 auto;}
  .kicker{color:var(--red);font-size:.75rem;font-weight:800;letter-spacing:.28em;text-transform:uppercase;margin-bottom:10px;}
  h2{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800;letter-spacing:.02em;margin-bottom:14px;}
  .rule{width:64px;height:3px;background:var(--red);border-radius:2px;margin:18px 0 30px;}
  .sub{color:var(--muted);max-width:46em;margin-bottom:36px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px 28px;
    transition:transform .2s,border-color .2s;
  }
  .card:hover{transform:translateY(-4px);border-color:#3a434f;}
  .card .icon{
    width:46px;height:46px;border-radius:9px;background:linear-gradient(145deg,var(--red),var(--red-dark));
    display:flex;align-items:center;justify-content:center;font-size:1.25rem;margin-bottom:18px;color:#fff;
  }
  .card h3{font-size:1.05rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px;}
  .card p{color:var(--muted);font-size:.93rem;}
  .card ul{margin-top:14px;display:flex;flex-direction:column;gap:9px;}
  .card ul li{
    color:var(--steel);font-size:.9rem;padding-inline-start:22px;position:relative;
  }
  .card ul li::before{content:"▸";color:var(--red);position:absolute;inset-inline-start:0;top:0;}

  /* about */
  .about-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:start;}
  .about-grid p{color:var(--muted);margin-bottom:16px;}
  .founder{
    background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--red);
    border-radius:12px;padding:28px;
  }
  .founder h3{font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;color:#fff;}
  .founder ul{display:flex;flex-direction:column;gap:12px;}
  .founder li{color:var(--steel);font-size:.92rem;padding-inline-start:24px;position:relative;}
  .founder li::before{content:"★";color:var(--red);position:absolute;inset-inline-start:0;font-size:.8rem;top:2px;}

  /* process */
  .steps{display:flex;flex-direction:column;gap:14px;counter-reset:step;}
  .step{
    display:flex;gap:20px;align-items:flex-start;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:20px 24px;
  }
  .step .n{
    flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--red);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.95rem;
  }
  .step h4{font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
  .step p{color:var(--muted);font-size:.9rem;}
  .process-note{
    margin-top:26px;background:var(--panel);border:1px dashed var(--line);border-radius:10px;
    padding:18px 22px;color:var(--steel);font-size:.92rem;
  }
  .process-note b{color:var(--red);}

  /* faq */
  .faq-item{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:12px;overflow:hidden;}
  .faq-q{
    width:100%;background:none;border:none;color:var(--text);cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:18px 22px;font-size:.98rem;font-weight:600;text-align:start;font-family:inherit;
  }
  .faq-q .chevron{color:var(--red);transition:transform .25s;font-size:.9rem;flex:0 0 auto;}
  .faq-item.open .chevron{transform:rotate(90deg);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .faq-a-inner{padding:0 22px 20px;color:var(--muted);font-size:.93rem;}

  /* contact */
  .contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:44px;align-items:start;}
  .contact-info p{color:var(--muted);margin-bottom:20px;}
  .contact-line{
    display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:16px 18px;margin-bottom:12px;transition:border-color .2s;
  }
  .contact-line:hover{border-color:var(--red);}
  .contact-line .ci{
    width:38px;height:38px;border-radius:8px;background:linear-gradient(145deg,var(--red),var(--red-dark));
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .contact-line .cl-label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .contact-line .cl-val{font-size:.95rem;color:#fff;font-weight:600;}
  form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px;}
  .field{margin-bottom:18px;}
  label{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
  input,textarea,select{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:12px 14px;font-size:.95rem;font-family:inherit;transition:border-color .2s;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--red);}
  textarea{min-height:120px;resize:vertical;}
  .form-note{font-size:.78rem;color:var(--muted);margin-top:14px;}

  /* referral banner */
  .referral{
    background:linear-gradient(90deg,rgba(210,31,43,.12),transparent 60%);
    border:1px solid rgba(210,31,43,.4);border-radius:12px;padding:22px 26px;
    max-width:1100px;margin:0 auto 0;display:flex;gap:16px;align-items:flex-start;
  }
  .referral .ri{font-size:1.4rem;color:var(--red);line-height:1;}
  .referral p{color:var(--steel);font-size:.93rem;}
  .referral b{color:#fff;}

  /* footer */
  footer{border-top:1px solid var(--line);background:var(--bg2);padding:46px 20px 30px;}
  .foot{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:center;}
  .foot .brand{font-size:.9rem;}
  .foot .ftag{color:var(--muted);font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;margin-top:6px;}
  .foot-right{color:var(--muted);font-size:.8rem;text-align:end;}
  .top-btn{
    position:fixed;bottom:24px;inset-inline-end:24px;z-index:90;width:46px;height:46px;border-radius:50%;
    background:var(--red);color:#fff;border:none;font-size:1.1rem;cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .3s;box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .top-btn.show{opacity:1;pointer-events:auto;}
  .top-btn:hover{background:var(--red-dark);}

  /* RTL tweaks */
  [dir="rtl"] body,[dir="rtl"] .faq-q{text-align:right;}

  /* responsive */
  @media(max-width:960px){
    .hero-inner,.about-grid,.contact-grid{grid-template-columns:1fr;}
    .grid3{grid-template-columns:1fr 1fr;}
    .grid4,.stats{grid-template-columns:1fr 1fr;}
    nav.links{display:none;}
    .cta-mini{display:none;}
    .burger{display:block;}
  }
  @media(max-width:560px){
    .grid2,.grid3,.grid4,.stats{grid-template-columns:1fr;}
    section{padding:60px 16px;}
    .hero{padding-top:110px;}
    .nav{padding:0 12px;gap:8px;}
    .nav-right{gap:8px;}
    .brand{font-size:.72rem;gap:6px;}
    .lang button{padding:4px 6px;font-size:.65rem;}
    .burger{padding:4px 10px;font-size:1rem;}
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="brand" href="#top">
      <span class="chev">▲</span>
      <span><span class="b1">BLACKRIDGE</span> <span class="b2">SYSTEMS</span></span>
    </a>
    <nav class="links">
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#services" data-i18n="nav_services"></a>
      <a href="#process" data-i18n="nav_process"></a>
      <a href="#why" data-i18n="nav_why"></a>
      <a href="#faq" data-i18n="nav_faq"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </nav>
    <div class="nav-right">
      <div class="lang" id="langSwitch">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="fr">FR</button>
        <button data-lang="es">ES</button>

      <a href="#contact" class="cta-mini" data-i18n="nav_cta"></a>
      <button class="burger" id="burger" aria-label="Menu">☰</button>
    </div>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <a href="#about" data-i18n="nav_about"></a>
    <a href="#services" data-i18n="nav_services"></a>
    <a href="#process" data-i18n="nav_process"></a>
    <a href="#why" data-i18n="nav_why"></a>
    <a href="#faq" data-i18n="nav_faq"></a>
    <a href="#contact" data-i18n="nav_contact"></a>
  </div>
</header>

/* ---------- rendering ---------- */
let currentLang = localStorage.getItem("br_lang") || "en";
if(!I18N[currentLang]) currentLang = "en";

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

function render(lang){
  const t = I18N[lang];
  currentLang = lang;
  localStorage.setItem("br_lang", lang);

  const root = document.getElementById("htmlRoot");
  root.setAttribute("lang", lang);
  root.setAttribute("dir", t.dir);

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if(t[k]!==undefined) el.textContent = t[k];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{
    const k = el.getAttribute("data-i18n-html");
    if(t[k]!==undefined) el.innerHTML = t[k];
  });

  document.getElementById("founderList").innerHTML = t.founder_list.map(x=>`<li>${esc(x)}</li>`).join("");
  document.getElementById("svc1List").innerHTML = t.svc1_list.map(x=>`<li>${esc(x)}</li>`).join("");
  document.getElementById("svc2List").innerHTML = t.svc2_list.map(x=>`<li>${esc(x)}</li>`).join("");

  document.getElementById("clientCards").innerHTML = t.cli_cards.map(c=>
    `<div class="card"><div class="icon">${c.icon}</div><h3>${esc(c.t)}</h3><p>${esc(c.d)}</p></div>`).join("");

  document.getElementById("stepsList").innerHTML = t.proc_steps.map((s,i)=>
    `<div class="step"><div class="n">${i+1}</div><div><h4>${esc(s.t)}</h4><p>${esc(s.d)}</p></div></div>`).join("");

  document.getElementById("whyCards").innerHTML = t.why_cards.map(c=>
    `<div class="card"><div class="icon">${c.icon}</div><h3>${esc(c.t)}</h3><p>${esc(c.d)}</p></div>`).join("");

  document.getElementById("faqList").innerHTML = t.faq.map((f,i)=>
    `<div class="faq-item" id="faqItem${i}">
       <button class="faq-q" onclick="toggleFaq(${i})" aria-expanded="false">
         <span>${esc(f.q)}</span><span class="chevron">▶</span>
       </button>
       <div class="faq-a"><div class="faq-a-inner">${esc(f.a)}</div></div>
     </div>`).join("");

  document.querySelectorAll("#langSwitch button").forEach(b=>{
    b.classList.toggle("active", b.getAttribute("data-lang")===lang);
  });

  document.title = "Blackridge Systems — " + t.foot_tag;
}

function toggleFaq(i){
  const item = document.getElementById("faqItem"+i);
  const ans = item.querySelector(".faq-a");
  const btn = item.querySelector(".faq-q");
  const open = item.classList.toggle("open");
  btn.setAttribute("aria-expanded", open);
  ans.style.maxHeight = open ? ans.scrollHeight + "px" : "0";
}

/* language switch */
document.querySelectorAll("#langSwitch button").forEach(b=>{
  b.addEventListener("click", ()=>render(b.getAttribute("data-lang")));
});

/* mobile menu */
const burger = document.getElementById("burger");
const mobileMenu = document.getElementById("mobileMenu");
burger.addEventListener("click", ()=>mobileMenu.classList.toggle("open"));
mobileMenu.querySelectorAll("a").forEach(a=>a.addEventListener("click", ()=>mobileMenu.classList.remove("open")));

/* back to top */
const topBtn = document.getElementById("topBtn");
window.addEventListener("scroll", ()=>topBtn.classList.toggle("show", window.scrollY>500));
topBtn.addEventListener("click", ()=>window.scrollTo({top:0,behavior:"smooth"}));

/* contact form -> opens the user's email program pre-filled */
document.getElementById("contactForm").addEventListener("submit", e=>{
  e.preventDefault();
  const t = I18N[currentLang];
  const name = document.getElementById("fName").value;
  const org = document.getElementById("fOrg").value;
  const email = document.getElementById("fEmail").value;
  const msg = document.getElementById("fMsg").value;
  const body = `${t.mail_name}: ${name}\n${t.mail_org}: ${org}\nEmail: ${email}\n\n${t.mail_msg}:\n${msg}`;
  window.location.href = "mailto:contact@blackridge-systems.com?subject="
    + encodeURIComponent(t.mail_subject) + "&body=" + encodeURIComponent(body);
});

render(currentLang);
</script>
