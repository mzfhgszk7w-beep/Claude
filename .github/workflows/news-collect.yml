name: News collect

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node news/collect.mjs
      - name: Commit new items
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "news: collect $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
