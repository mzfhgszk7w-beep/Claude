name: News collect

# Ein Lauf sammelt ~6 Stunden lang alle 15 Minuten (news/loop.sh).
# Der stündliche Zeitplan sorgt nur dafür, dass immer ein Lauf aktiv oder wartend ist.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock sharp@0.33.5
      - name: Collect loop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash news/loop.sh
